<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель — AffitDev</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <header>
        <a href="index.html" class="logo-container">
            <div class="custom-logo"><svg viewBox="0 0 100 100"><path d="M 15 10 L 85 10 C 88 10 90 12 90 15 L 90 85 C 90 88 88 90 85 90 L 15 90 C 12 90 10 88 10 85 L 10 15 C 10 12 12 10 15 10 Z M 25 25 L 25 75 L 40 75 L 50 55 L 60 75 L 75 75 L 75 25 L 60 25 L 60 50 L 50 35 L 40 50 L 40 25 L 25 25 Z" fill="#fff" fill-rule="evenodd" clip-rule="evenodd"/></svg></div>
            <span class="logo-text">AffitDev</span>
        </a>
        <div class="auth-buttons">
            <span id="admin-name" style="color: #00ff88; font-weight: 700; padding: 10px 20px;">...</span>
            <a href="profile.html" class="btn btn-login">Профиль</a>
            <button onclick="logout()" class="btn btn-login">Выйти</button>
        </div>
    </header>

    <div class="admin-container">
        <div id="access-denied" class="hidden" style="text-align:center; padding: 60px;">
            <h2 style="font-size: 32px; margin-bottom: 20px;">Доступ запрещен</h2>
            <a href="index.html" class="btn btn-outline">На главную</a>
        </div>

        <div id="admin-panel" class="hidden">
            <h1 style="font-size: 36px; font-weight: 900; margin-bottom: 10px;">Админ-панель</h1>
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('resources', event)">Управление ресурсами</button>
                <button class="tab-btn" onclick="switchTab('users', event)">Пользователи</button>
            </div>

            <div id="tab-resources" class="tab-content active">
                <div class="form-card" style="max-width: 100%; margin-bottom: 40px;">
                    <h2 style="font-size: 20px; margin-bottom: 20px;">➕ Опубликовать новый ресурс</h2>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div class="form-group"><label>Название</label><input type="text" id="new-title" class="form-input"></div>
                        <div class="form-group"><label>Картинка (URL)</label><input type="url" id="new-image" class="form-input"></div>
                    </div>
                    <div class="form-group"><label>Краткое описание</label><textarea id="new-desc" class="form-input" style="min-height: 80px;"></textarea></div>
                    <div class="form-group"><label>Полное описание</label><textarea id="new-extra-desc" class="form-input" style="min-height: 120px;"></textarea></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div class="form-group"><label>Версии (через запятую)</label><input type="text" id="new-versions" class="form-input"></div>
                        <div class="form-group"><label>Авторы</label><input type="text" id="new-authors" class="form-input"></div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div class="form-group"><label>Релизы</label><input type="text" id="new-releases" class="form-input"></div>
                        <div class="form-group"><label>Ссылка на файл (URL)</label><input type="url" id="new-file-url" class="form-input"></div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div class="form-group">
                            <label>Тип ресурса</label>
                            <select id="new-type" class="form-input">
                                <option value="Сборка">Сборка</option>
                                <option value="Плагин" selected>Плагин</option>
                                <option value="Мир">Мир</option>
                                <option value="Ресурс пак">Ресурс пак</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Показывать на главной?</label>
                            <select id="new-featured" class="form-input">
                                <option value="false">Нет</option>
                                <option value="true">Да (Избранное)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group"><label>Цена (0 = бесплатно)</label><input type="number" id="new-price" class="form-input" value="0"></div>
                    <button class="btn btn-main btn-full" onclick="publishResource()">Опубликовать</button>
                </div>

                <h3 style="margin-bottom: 20px;">📦 Существующие ресурсы</h3>
                <div id="admin-resources-list"></div>
            </div>

            <div id="tab-users" class="tab-content">
                <h3 style="margin-bottom: 20px;">Все пользователи</h3>
                <table class="users-table">
                    <thead><tr><th>Никнейм</th><th>Баланс</th><th>Роль</th><th>Действия</th></tr></thead>
                    <tbody id="users-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script>
        async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            const { data: profile } = await _supabase.from('profiles').select('username, is_admin').eq('id', session.user.id).single();
            if (!profile?.is_admin) return document.getElementById('access-denied').classList.remove('hidden');
            
            document.getElementById('admin-name').textContent = '👑 ' + profile.username;
            document.getElementById('admin-panel').classList.remove('hidden');
            loadResources(); loadUsers();
        }

        function switchTab(name, e) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        }

        async function publishResource() {
            const data = {
                title: document.getElementById('new-title').value,
                image_url: document.getElementById('new-image').value,
                description: document.getElementById('new-desc').value,
                extra_desc: document.getElementById('new-extra-desc').value,
                version: document.getElementById('new-versions').value,
                authors: document.getElementById('new-authors').value,
                releases: document.getElementById('new-releases').value,
                file_url: document.getElementById('new-file-url').value,
                type: document.getElementById('new-type').value,
                is_featured: document.getElementById('new-featured').value === 'true',
                price: parseFloat(document.getElementById('new-price').value) || 0
            };
            if (!data.title) return showToast('Введите название', 'error');
            const { error } = await _supabase.from('resources').insert(data);
            if (error) showToast(error.message, 'error');
            else { showToast('Ресурс добавлен!', 'success'); loadResources(); }
        }

        async function loadResources() {
            const { data } = await _supabase.from('resources').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('admin-resources-list');
            if (!data) return;
            container.innerHTML = data.map(r => `
                <div class="admin-resource-item" style="display:flex; justify-content:space-between; padding:15px; background:rgba(255,255,255,0.03); border-radius:12px; margin-bottom:10px;">
                    <div><strong>${r.title}</strong> <span style="color:var(--muted); font-size:12px;">(${r.type})</span></div>
                    <button class="btn-danger" onclick="deleteResource('${r.id}')">Удалить</button>
                </div>
            `).join('');
        }

        async function deleteResource(id) {
            showConfirm('Удалить ресурс?', async (yes) => {
                if (!yes) return;
                await _supabase.from('resources').delete().eq('id', id);
                loadResources();
            });
        }

        async function loadUsers() {
            const { data } = await _supabase.from('profiles').select('*');
            document.getElementById('users-list').innerHTML = data.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.balance} ₽</td>
                    <td>${u.is_admin ? 'Админ' : 'Юзер'}</td>
                    <td><button class="btn-success" onclick="addBalance('${u.id}', 100)">+100₽</button></td>
                </tr>
            `).join('');
        }

        async function addBalance(id, amt) {
            const { data } = await _supabase.from('profiles').select('balance').eq('id', id).single();
            await _supabase.from('profiles').update({ balance: (data.balance || 0) + amt }).eq('id', id);
            loadUsers();
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'index.html'; }
        init();
    </script>
</body>
</html>
