<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медийные личности — AffitDev</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>
    
    <header>
        <a href="index.html" class="logo-container">
            <div class="custom-logo">
                <svg viewBox="0 0 100 100"><path d="M 15 10 L 85 10 C 88 10 90 12 90 15 L 90 85 C 90 88 88 90 85 90 L 15 90 C 12 90 10 88 10 85 L 10 15 C 10 12 12 10 15 10 Z M 25 25 L 25 75 L 40 75 L 50 55 L 60 75 L 75 75 L 75 25 L 60 25 L 60 50 L 50 35 L 40 50 L 40 25 L 25 25 Z" fill="#fff" fill-rule="evenodd" clip-rule="evenodd"/></svg>
            </div>
            <span class="logo-text">AffitDev</span>
        </a>
        <div id="header-auth" class="auth-buttons"></div>
    </header>

    <section style="padding: 60px 50px; max-width: 1400px; margin: 0 auto; width: 100%;">
        <h1 style="font-size: 42px; font-weight: 900; margin-bottom: 10px;">Медийные личности</h1>
        <p style="color: var(--muted); margin-bottom: 40px;">Авторы контента, которые делают наш проект лучше.</p>
        
        <div class="cards-grid" style="grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));">
            
            <!-- Карточка Yamacreator.mp4 -->
            <a href="https://youtube.com/@yamacreator" target="_blank" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-image" style="height: 200px; background: #111; position: relative; overflow: hidden;">
                    
                    <!-- Если у тебя есть аватарка, замени блок ниже на: -->
                    <!-- <img src="ссылка_на_аватарку.jpg" style="width: 100%; height: 100%; object-fit: cover;"> -->
                    
                    <!-- Временная заглушка с градиентом -->
                    <div style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #1a1a1a, #333);">
                        <span style="font-size: 64px; font-weight: 900; color: #fff;">Y</span>
                    </div>
                    
                    <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);"></div>
                    <!-- Иконка ютуба -->
                    <svg style="position: absolute; bottom: 15px; right: 15px; width: 30px; height: 30px; fill: #ff0000; z-index: 2; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <div class="card-title" style="font-size: 24px;">Yamacreator.mp4</div>
                    </div>
                    <p style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">
                        Создатель крутого контента по Minecraft, обзоры, геймплей и многое другое.
                    </p>
                    <div style="display: flex; align-items: center; gap: 10px; color: #ccc; font-size: 14px; font-weight: 600;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#ff0000"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                        youtube.com/@yamacreator
                    </div>
                </div>
            </a>

            <!-- Карточка Бдшка -->
            <a href="https://youtube.com/@bdfka" target="_blank" class="card" style="text-decoration: none; color: inherit;">
                <div class="card-image" style="height: 200px; background: #111; position: relative; overflow: hidden;">
                    
                    <!-- Временная заглушка с градиентом -->
                    <div style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #1a1a1a, #333);">
                        <span style="font-size: 64px; font-weight: 900; color: #fff;">Б</span>
                    </div>
                    
                    <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);"></div>
                    <!-- Иконка ютуба -->
                    <svg style="position: absolute; bottom: 15px; right: 15px; width: 30px; height: 30px; fill: #ff0000; z-index: 2; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <div class="card-title" style="font-size: 24px; display: flex; align-items: center;">
                            Бдшка
                            <!-- RGB-галочка админа -->
                            <span class="verified-badge" title="Администратор" style="margin-left: 8px;">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                </svg>
                            </span>
                        </div>
                    </div>
                    <p style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">
                        Разработчик платформы AffitDev, автор модов и плагинов на заказ.
                    </p>
                    <div style="display: flex; align-items: center; gap: 10px; color: #ccc; font-size: 14px; font-weight: 600;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="#ff0000"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                        youtube.com/@bdfka
                    </div>
                </div>
            </a>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script>
        async function initHeader() {
            const { data: { session } } = await _supabase.auth.getSession();
            const headerAuth = document.getElementById('header-auth');

            const badgeHTML = `
                <span class="verified-badge" title="Администратор" style="margin-left: 8px;">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </span>
            `;

            if (session) {
                const { data: profile } = await _supabase.from('profiles').select('username, is_admin').eq('id', session.user.id).single();
                
                const userDisplay = profile?.is_admin 
                    ? `<span class="user-name-wrapper">${profile.username} ${badgeHTML}</span>` 
                    : (profile?.username || 'Профиль');

                headerAuth.innerHTML = `
                    <a href="profile.html" class="btn btn-login" style="display:flex; align-items:center;">${userDisplay}</a>
                    ${profile?.is_admin ? '<a href="admin.html" class="btn btn-login" style="color:#00ff88;">Админ</a>' : ''}
                    <button onclick="logout()" class="btn btn-login">Выйти</button>
                `;
            } else {
                headerAuth.innerHTML = `<a href="login.html" class="btn btn-login">Войти</a><a href="register.html" class="btn btn-register">Регистрация</a>`;
            }
        }

        async function logout() { await _supabase.auth.signOut(); location.reload(); }
        
        initHeader();
    </script>
</body>
</html>
