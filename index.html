<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AffitDev — Место где рождается проект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>
    <header>
        <a href="index.html" class="logo-container">
            <div class="custom-logo">
                <svg viewBox="0 0 100 100"><path d="M 15 10 L 85 10 C 88 10 90 12 90 15 L 90 85 C 90 88 88 90 85 90 L 15 90 C 12 90 10 88 10 85 L 10 15 C 10 12 12 10 15 10 Z M 25 25 L 25 75 L 40 75 L 50 55 L 60 75 L 75 75 L 75 25 L 60 25 L 60 50 L 50 35 L 40 50 L 40 25 L 25 25 Z" fill="#fff" fill-rule="evenodd" clip-rule="evenodd"/></svg>
            </div>
            <span class="logo-text">AffitDev</span>
        </a>
        <div id="header-auth" class="auth-buttons"></div>
    </header>

    <section class="hero">
        <h1>
            AffitDev — Место где<br>
            <span class="dynamic-word" id="changing-text">рождается</span><span class="cursor"></span><br>
            проект
        </h1>
        <div class="hero-actions" id="hero-actions">
            <a href="login.html" class="btn btn-main" id="hero-login">Войти</a>
            <a href="qwaan.html" class="btn btn-outline" style="display:flex; align-items:center; gap:8px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
    Qwaan AI
</a>
            <a href="resources.html" class="btn btn-outline">Ресурсы</a>
            <a href="creators.html" class="btn btn-login" style="margin-right: 10px;">Медиа</a>
            <a href="tools.html" class="btn btn-login" style="margin-right: 10px;">Утилиты</a>
        </div>
    </section>

    <section style="padding: 60px 50px; max-width: 1400px; margin: 0 auto; width: 100%;">
        <h2 style="font-size: 36px; font-weight: 800; margin-bottom: 40px;">Рекомендуемые ресурсы</h2>
        <div class="cards-grid" id="resources-grid"><p style="color: var(--muted);">Загрузка...</p></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script>
        const words = ["рождается", "делается", "ебеться"];
        const el = document.getElementById("changing-text");
        let idx = 0;
        setInterval(() => {
            el.style.opacity = 0;
            setTimeout(() => { idx = (idx + 1) % words.length; el.textContent = words[idx]; el.style.opacity = 1; }, 300);
        }, 2500);

        async function initHeader() {
            const { data: { session } } = await _supabase.auth.getSession();
            const headerAuth = document.getElementById('header-auth');
            const heroLogin = document.getElementById('hero-login');

            const badgeHTML = `
                <span class="verified-badge" title="Администратор">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </span>
            `;

            if (session) {
                const { data: profile } = await _supabase.from('profiles').select('username, is_admin').eq('id', session.user.id).single();
                
                const userDisplay = profile?.is_admin 
                    ? `<span class="user-name-wrapper">${profile.username} ${badgeHTML}</span>` 
                    : (profile?.username || 'Профиль');

                headerAuth.innerHTML = `
                    <a href="profile.html" class="btn btn-login" style="display:flex; align-items:center;">${userDisplay}</a>
                    ${profile?.is_admin ? '<a href="admin.html" class="btn btn-login" style="color:#00ff88;">Админ</a>' : ''}
                    <button onclick="logout()" class="btn btn-login">Выйти</button>
                `;
                heroLogin.textContent = 'Профиль';
                heroLogin.href = 'profile.html';
            } else {
                headerAuth.innerHTML = `<a href="login.html" class="btn btn-login">Войти</a><a href="register.html" class="btn btn-register">Регистрация</a>`;
            }
        }

        async function logout() { await _supabase.auth.signOut(); location.reload(); }

        async function loadResources() {
            const grid = document.getElementById('resources-grid');
            let { data } = await _supabase.from('resources').select('*').eq('is_featured', true).limit(6);
            if (!data || data.length === 0) {
                const fallback = await _supabase.from('resources').select('*').order('created_at', { ascending: false }).limit(6);
                data = fallback.data;
            }
            if (!data || data.length === 0) { grid.innerHTML = '<p style="color: var(--muted);">Пока нет ресурсов.</p>'; return; }
            
            grid.innerHTML = data.map(r => {
                const price = parseFloat(r.price) || 0;
                return `
                <div class="card" onclick="window.location.href='resources.html?id=${r.id}'" style="cursor:pointer;">
                    <div class="card-image">
                        ${r.image_url ? `<img src="${r.image_url}">` : `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>`}
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <div class="card-title">${r.title}</div>
                            <div class="card-version" style="margin-right:5px;">${r.type}</div>
                            <div class="card-version">${r.version || 'v1.0'}</div>
                        </div>
                        <div class="card-footer">
                            <div class="${price > 0 ? 'price-paid' : 'price-free'}">${price > 0 ? price + ' ₽' : 'Бесплатно'}</div>
                            <button class="btn-download">Подробнее</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
        initHeader(); loadResources();
    </script>
</body>
</html>
