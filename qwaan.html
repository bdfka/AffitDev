<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwaan AI — AffitDev</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подсветка кода -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        /* Стили, чтобы Qwaan вписался в общую тему, но имел свой интерфейс */
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Левая панель (Чаты) */
        .qwaan-sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .new-chat-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .new-chat-btn:hover { background: #ddd; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }
        .chat-item:hover, .chat-item.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* Правая панель (Чат) */
        .qwaan-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.user {
            align-self: flex-end;
            background: #fff;
            color: #000;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        /* Блоки кода */
        .code-block {
            margin: 15px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #0a0a0a;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: #111;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
        }
        .code-header button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
            transition: 0.2s;
        }
        .code-header button:hover { background: rgba(255,255,255,0.2); }
        .code-block pre {
            margin: 0;
            padding: 15px;
            overflow-x: auto;
        }
        .code-block code {
            font-family: monospace;
            font-size: 13px;
        }

        /* Поле ввода */
        .input-area {
            padding: 20px;
            background: rgba(3, 3, 3, 0.9);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            transition: 0.3s;
        }
        .input-wrapper:focus-within { border-color: #444; }
        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 150px;
            min-height: 24px;
            font-family: 'Inter', sans-serif;
            padding: 8px;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 8px;
            font-size: 18px;
            transition: 0.2s;
        }
        .icon-btn:hover { color: #fff; }
        .send-btn {
            background: #fff;
            color: #000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        .send-btn:hover { background: #ddd; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Модальное окно API */
        .modal-api {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-api.active { display: flex; }
        .modal-api-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
        }

        /* Про-бейдж */
        .pro-badge {
            background: linear-gradient(90deg, #ffaa00, #ff5500);
            color: #000;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            vertical-align: middle;
            margin-left: 5px;
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .qwaan-sidebar { display: none; }
            .chat-container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Шапка сайта (упрощенная, чтобы не мешала чату) -->
    <header style="position: absolute; top: 0; left: 0; width: 100%; padding: 15px 30px; z-index: 20; background: transparent; border-bottom: none; pointer-events: none;">
        <a href="index.html" class="logo-container" style="pointer-events: auto;">
            <div class="custom-logo" style="width: 36px; height: 36px;">
                <svg viewBox="0 0 100 100"><path d="M 15 10 L 85 10 C 88 10 90 12 90 15 L 90 85 C 90 88 88 90 85 90 L 15 90 C 12 90 10 88 10 85 L 10 15 C 10 12 12 10 15 10 Z M 25 25 L 25 75 L 40 75 L 50 55 L 60 75 L 75 75 L 75 25 L 60 25 L 60 50 L 50 35 L 40 50 L 40 25 L 25 25 Z" fill="#fff" fill-rule="evenodd" clip-rule="evenodd"/></svg>
            </div>
            <span class="logo-text" style="font-size: 20px;">AffitDev</span>
        </a>
    </header>

    <!-- Сайдбар чатов -->
    <div class="qwaan-sidebar" style="padding-top: 80px;">
        <button class="new-chat-btn" onclick="newChat()">+ Новый чат</button>
        <div class="chat-list" id="chat-list"></div>
        
        <div style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
            <div style="font-size: 11px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; font-weight: 700;">Qwaan AI</div>
            <button class="btn btn-outline" style="width: 100%; padding: 10px; font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;" onclick="openConfigEditor()">
                <span>Редактор конфигов</span>
                <span class="pro-badge">PRO</span>
            </button>
            <button class="btn btn-outline" style="width: 100%; padding: 10px; font-size: 13px;" onclick="openApiModal()">⚙ API Ключ</button>
        </div>
    </div>

    <!-- Основная область -->
    <div class="qwaan-main">
        <div class="chat-container" id="chat-container" style="padding-top: 80px;">
            <!-- Сообщения -->
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Прикрепить файл">📎</button>
                <input type="file" id="file-input" style="display:none;" accept=".py,.js,.txt,.yml,.toml" onchange="handleFile(event)">
                <textarea id="message-input" rows="1" placeholder="Спроси Qwaan..." oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 150) + 'px';" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
            </div>
            <div style="text-align: center; font-size: 11px; color: var(--muted); margin-top: 10px;">
                Qwaan может ошибаться. Проверяйте код. Прикрепляйте файлы: .py, .js, .txt, .yml, .toml
            </div>
        </div>
    </div>

    <!-- Модалка API -->
    <div class="modal-api" id="api-modal">
        <div class="modal-api-content">
            <h3 style="margin-bottom: 15px; font-size: 20px;">API Ключ</h3>
            <p style="font-size: 13px; color: var(--muted); margin-bottom: 20px;">Для работы Qwaan нужен бесплатный ключ от OpenRouter. Он хранится только в вашем браузере.</p>
            <input type="password" id="api-key-input" class="form-input" placeholder="sk-or-v1-..." style="margin-bottom: 15px;">
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-main" style="flex:1; padding: 12px;" onclick="saveApiKey()">Сохранить</button>
                <button class="btn btn-outline" style="flex:1; padding: 12px;" onclick="document.getElementById('api-modal').classList.remove('active')">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // --- Состояние ---
        let chats = JSON.parse(localStorage.getItem('qwaan_chats') || '[]');
        let currentChatId = null;
        let attachedFile = null;
        let apiKey = localStorage.getItem('qwaan_api_key') || '';

        // --- Инициализация ---
        function init() {
            if (chats.length === 0) newChat();
            else { loadChat(chats[0].id); }
            if (!apiKey) setTimeout(openApiModal, 1000);
        }

        function newChat() {
            const id = Date.now().toString();
            chats.unshift({ id, title: 'Новый чат', messages: [] });
            currentChatId = id;
            saveChats(); renderChatList(); loadChat(id);
        }

        function saveChats() { localStorage.setItem('qwaan_chats', JSON.stringify(chats)); }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = chats.map(c => `<div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChat('${c.id}')">${escapeHtml(c.title)}</div>`).join('');
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            const container = document.getElementById('chat-container');
            
            if (chat.messages.length === 0) {
                container.innerHTML = `
                    <div class="message ai">
                        Привет! Я Qwaan, твой AI-помощник по коду и конфигам. <br><br>
                        Можешь просто задать вопрос, прикрепить файл (.py, .js, .yml, .toml) или попросить отредактировать код.
                    </div>
                `;
            } else {
                container.innerHTML = chat.messages.map(m => renderMessage(m)).join('');
            }
            
            renderChatList();
            scrollToBottom();
        }

        function renderMessage(msg) {
            if (msg.role === 'user') {
                return `<div class="message user">${escapeHtml(msg.content)}</div>`;
            } else {
                let html = escapeHtml(msg.content);
                // Парсинг блоков кода
                html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                    const id = 'code-' + Math.random().toString(36).substr(2, 9);
                    const escaped = escapeHtml(code.trim());
                    return `<div class="code-block">
                        <div class="code-header">
                            <span>${lang || 'code'}</span>
                            <div>
                                <button onclick="copyCode('${id}')">Копировать</button>
                                <button onclick="downloadCode('${id}', '${lang}')">Скачать</button>
                            </div>
                        </div>
                        <pre><code id="${id}" class="language-${lang}">${escaped}</code></pre>
                    </div>`;
                });
                return `<div class="message ai">${html}</div>`;
            }
        }

        function copyCode(id) {
            const code = document.getElementById(id).innerText;
            navigator.clipboard.writeText(code);
            alert('Код скопирован!');
        }

        function downloadCode(id, ext) {
            const code = document.getElementById(id).innerText;
            const blob = new Blob([code], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `qwaan.${ext === 'javascript' ? 'js' : ext === 'python' ? 'py' : ext}`;
            a.click();
        }

        // --- Отправка ---
        async function sendMessage() {
            const input = document.getElementById('message-input');
            let text = input.value.trim();
            if (!text && !attachedFile) return;
            if (!apiKey) return openApiModal();

            let fullContent = text;
            if (attachedFile) {
                fullContent = `[Файл: ${attachedFile.name}]\n\`\`\`${attachedFile.lang}\n${attachedFile.content}\n\`\`\`\n\n${text}`;
            }

            const chat = chats.find(c => c.id === currentChatId);
            chat.messages.push({ role: 'user', content: fullContent });
            if (chat.title === 'Новый чат') chat.title = text.slice(0, 25) || attachedFile.name;

            input.value = ''; input.style.height = 'auto';
            attachedFile = null;
            saveChats(); loadChat(currentChatId);
            
            document.getElementById('send-btn').disabled = true;
            document.getElementById('send-btn').innerHTML = '...';

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'AffitDev Qwaan'
                    },
                    body: JSON.stringify({
                        model: 'qwen/qwen3-coder:free', // Бесплатная модель для кода
                        messages: chat.messages.map(m => ({ role: m.role, content: m.content })),
                        stream: false
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'Ошибка сети');
                }

                const data = await response.json();
                chat.messages.push({ role: 'assistant', content: data.choices[0].message.content });
                saveChats(); loadChat(currentChatId);
            } catch (e) {
                const chat = chats.find(c => c.id === currentChatId);
                chat.messages.push({ role: 'assistant', content: `❌ Ошибка: ${e.message}` });
                saveChats(); loadChat(currentChatId);
            } finally {
                document.getElementById('send-btn').disabled = false;
                document.getElementById('send-btn').innerHTML = '➤';
            }
        }

        // --- Файлы ---
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const ext = file.name.split('.').pop();
                const langMap = { py: 'python', js: 'javascript', yml: 'yaml', toml: 'toml', txt: 'text' };
                attachedFile = { name: file.name, content: ev.target.result, lang: langMap[ext] || 'text' };
                document.getElementById('message-input').placeholder = `Прикреплён: ${file.name}`;
            };
            reader.readAsText(file);
            e.target.value = ''; // сброс
        }

        // --- Настройки / API ---
        function openApiModal() { 
            document.getElementById('api-modal').classList.add('active'); 
            document.getElementById('api-key-input').value = apiKey;
        }

        function saveApiKey() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('qwaan_api_key', apiKey);
            document.getElementById('api-modal').classList.remove('active');
        }

        // --- Pro (Заглушка) ---
        function openConfigEditor() {
            alert('Редактор конфигов доступен в Qwaan Pro.\n\nВ демо-версии вы можете просто написать в чат: "Переделай мой конфиг..." и прикрепить файл .yml или .toml.');
            // Для удобства вставляем быстрый промпт
            document.getElementById('message-input').value = 'Переделай мой конфиг, сделай его оптимальнее и добавь комментарии:\n\n';
            document.getElementById('message-input').focus();
        }

        // --- Утилиты ---
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function scrollToBottom() { const c = document.getElementById('chat-container'); c.scrollTop = c.scrollHeight; }
        
        // Подсветка синтаксиса для старых сообщений
        document.addEventListener('DOMContentLoaded', () => {
            init();
            hljs.highlightAll();
        });
    </script>
</body>
</html>
