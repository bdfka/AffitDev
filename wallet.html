<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кошелек — AffitDev</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow"></div>
    
    <header>
        <a href="index.html" class="logo-container">
            <div class="custom-logo">
                <svg viewBox="0 0 100 100"><path d="M 15 10 L 85 10 C 88 10 90 12 90 15 L 90 85 C 90 88 88 90 85 90 L 15 90 C 12 90 10 88 10 85 L 10 15 C 10 12 12 10 15 10 Z M 25 25 L 25 75 L 40 75 L 50 55 L 60 75 L 75 75 L 75 25 L 60 25 L 60 50 L 50 35 L 40 50 L 40 25 L 25 25 Z" fill="#fff" fill-rule="evenodd" clip-rule="evenodd"/></svg>
            </div>
            <span class="logo-text">AffitDev</span>
        </a>
        <div class="auth-buttons">
            <a href="profile.html" class="btn btn-login">Профиль</a>
            <a href="index.html" class="btn btn-login">На главную</a>
        </div>
    </header>

    <div class="page-container">
        <div class="form-card" style="max-width: 550px; padding: 50px 40px;">
            
            <div style="text-align: center;">
                <p style="color: var(--muted); font-size: 15px; margin-bottom: 15px;">Ваш баланс</p>
                
                <!-- Блок с балансом и неоновым свечением -->
                <div id="wallet-balance" style="
                    font-size: 64px; 
                    font-weight: 900; 
                    background: linear-gradient(90deg, #00d2ff, #00ff88); 
                    -webkit-background-clip: text; 
                    -webkit-text-fill-color: transparent; 
                    filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.4)) drop-shadow(0 0 40px rgba(0, 255, 136, 0.2));
                    line-height: 1.2;
                ">
                    0 ₽
                </div>
            </div>

            <!-- Блок с Telegram Stars -->
            <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; margin-top: 40px; text-align: center;">
                <p style="color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 20px;">
                    Пополняйте кошелек через <b style="color: #fff;">Telegram Stars</b>, покупайте эксклюзивные ресурсы и делайте свой проект красочнее!
                </p>
                
                <!-- Кнопки выбора суммы пополнения -->
                <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px;">
                    <button class="btn btn-outline" style="padding: 10px 20px; flex: 1; min-width: 100px;" onclick="window.open('https://t.me/AffitDev_bot?start=pay_50', '_blank')">50 ⭐</button>
                    <button class="btn btn-outline" style="padding: 10px 20px; flex: 1; min-width: 100px;" onclick="window.open('https://t.me/AffitDev_bot?start=pay_100', '_blank')">100 ⭐</button>
                    <button class="btn btn-outline" style="padding: 10px 20px; flex: 1; min-width: 100px;" onclick="window.open('https://t.me/AffitDev_bot?start=pay_250', '_blank')">250 ⭐</button>
                    <button class="btn btn-outline" style="padding: 10px 20px; flex: 1; min-width: 100px;" onclick="window.open('https://t.me/AffitDev_bot?start=pay_500', '_blank')">500 ⭐</button>
                </div>
                
                <p style="color: var(--muted); font-size: 12px; margin-top: 15px;">
                    1 Star = 2 ₽ • Оплата проходит в Telegram
                </p>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="profile.html" class="form-link" style="margin-top: 0;">← Вернуться в профиль</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script>
        let currentUser = null;
        let currentBalance = 0;

        async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            
            currentUser = session.user;
            await updateBalanceUI();
        }

        // Функция для загрузки и обновления баланса
        async function updateBalanceUI() {
            const { data: profile } = await _supabase
                .from('profiles')
                .select('balance')
                .eq('id', currentUser.id)
                .single();

            currentBalance = parseFloat(profile?.balance) || 0;
            document.getElementById('wallet-balance').textContent = currentBalance + ' ₽';
        }

        init();
    </script>
</body>
</html>
